[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # long lines in research scripts are tolerated
  "E402",  # imports mid-cell are normal in notebooks
]

[tool.ruff.lint.per-file-ignores]
"run_summarization.py" = ["E741"]  # vendored HuggingFace example; kept verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
