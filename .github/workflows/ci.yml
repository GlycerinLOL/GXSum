name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff check .
      - name: Test
        # Only numpy + pytest: the heavy ML stack is stubbed in tests/test_smoke.py,
        # so CI never downloads torch/transformers or touches HuggingFace.
        run: uvx --with numpy --with pytest pytest
